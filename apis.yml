aid: cozy-finance
name: Cozy Finance
description: >-
  Cozy Finance is a decentralized finance (DeFi) risk-management protocol that
  helps onchain protocols unlock safety-seeking capital through composable,
  institutional-grade coverage. Its Cozy Safety Module (CSM) lets teams deploy
  onchain safety modules, rewards managers, and controllers that backstop
  capital against security incidents and market risk, using mechanisms such as
  tranching (junior/senior yield), reserves, and market-based protection
  contracts. The protocol is used by teams around protocols such as Euler, Lido,
  and Aave, and is backed by Polychain Capital, Electric Capital, Dragonfly, and
  Coinbase Ventures. The integration surface is Solidity smart contracts
  documented at csm-docs.cozy.finance, with TypeScript / ethers.js developer
  guides; there is no REST or HTTP API.
